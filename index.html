<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f7b6c">
<title>Alif — Arabe littéraire</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alif">
<style>
:root{
  --bg:#edf2f0; --card:#ffffff; --ink:#18233a; --muted:#5d6b7e; --line:#d5dfdb;
  --accent:#0f7b6c; --accent-ink:#ffffff; --soft:#dcebe7; --saffron:#c98a17; --saffron-bg:#fbefd6;
  --ok:#1f7a45; --ok-bg:#dff1e6; --ko:#b3412f; --ko-bg:#f8e1dc;
  --ar-size:44px; color-scheme:light;
  --ar-font:"Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Amiri","Traditional Arabic","Segoe UI","Arial",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1626; --card:#18213a; --ink:#e8ecf4; --muted:#9aa6ba; --line:#2a3653;
    --accent:#3fc1a8; --accent-ink:#0b1a17; --soft:#1d3340; --saffron:#f0be5a; --saffron-bg:#3a2f17;
    --ok:#6fd39a; --ok-bg:#16352a; --ko:#f08b78; --ko-bg:#3d2220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1626; --card:#18213a; --ink:#e8ecf4; --muted:#9aa6ba; --line:#2a3653;
  --accent:#3fc1a8; --accent-ink:#0b1a17; --soft:#1d3340; --saffron:#f0be5a; --saffron-bg:#3a2f17;
  --ok:#6fd39a; --ok-bg:#16352a; --ko:#f08b78; --ko-bg:#3d2220; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.25;margin:0 0 .3em}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1.05rem}
p{margin:.4em 0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.brand .ar{font-size:30px;line-height:1;color:var(--accent)}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px}
.streak{margin-left:auto;font-size:14px;color:var(--muted);white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 12px;cursor:pointer;min-width:64px}
.tabs button span{font-size:20px;line-height:1.2}
.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.ar{font-family:var(--ar-font);direction:rtl;unicode-bidi:isolate;line-height:1.75}
.big{font-size:calc(var(--ar-size)*1.7)}
.mid{font-size:var(--ar-size)}
.sm{font-size:calc(var(--ar-size)*.6)}
.small{font-size:.875rem}
.muted{color:var(--muted)}
.tr{color:var(--muted);font-style:italic}
body.no-tr .tr{display:none}
.center{text-align:center;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.between{justify-content:space-between}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.sm{min-height:38px;padding:6px 11px;font-size:.9rem;border-radius:999px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.hero{display:flex;gap:16px;align-items:center;background:var(--accent);color:var(--accent-ink);border:0}
.hero .ar{font-size:64px;line-height:1.1}
.hero p{opacity:.85}
.review-card{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mhead{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.mnum{flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.mprog{margin-left:auto;font-size:.875rem;color:var(--muted)}
.module.is-locked{opacity:.6}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer;min-height:52px}
.lesson:disabled{cursor:default;opacity:.5}
.lesson .lst{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--bg);flex:none}
.lesson.done .lst{background:var(--ok-bg);color:var(--ok);font-weight:700}
.lesson .ltitle{flex:1}
.ltitle .ar{font-size:1.45em;line-height:1.2}
.lscore{font-size:.85rem;color:var(--muted)}
.letter .lhead{display:flex;gap:16px;align-items:center}
.glyph{flex:none;width:112px;height:112px;border-radius:24px;background:var(--soft);border:0;font-size:76px;line-height:1;color:var(--accent);cursor:pointer;display:grid;place-items:center;font-family:var(--ar-font)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--bg);border-radius:14px;padding:6px;margin:10px 0}
.forms .ar{font-size:calc(var(--ar-size)*.9)}
.tip{background:var(--soft);border-radius:10px;padding:8px 10px}
.warn{background:var(--saffron-bg);border-radius:10px;padding:8px 10px}
.example{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.example .ar{font-size:calc(var(--ar-size)*.8)}
.rec{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rec.recording [data-act="rec"]{background:var(--ko);color:#fff;border-color:var(--ko)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qprompt{font-size:1.05rem;font-weight:600;margin-bottom:6px}
.qprompt .ar{font-weight:400}
.show{text-align:center;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px;min-height:72px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ko{background:var(--ko-bg);border-color:var(--ko)}
.opt .ar{line-height:1.5}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px}
.fb.ok{background:var(--ok-bg)} .fb.ko{background:var(--ko-bg)}
.fb b{display:block}
.score{font-size:56px;font-weight:700;text-align:center;color:var(--accent);margin:6px 0}
.reader-word{text-align:center;margin:4px 0}
.seg{border-radius:8px;transition:background .15s,color .15s}
.seg.hl{background:var(--saffron-bg);color:var(--saffron)}
.seg.mute{color:var(--muted);opacity:.45}
.seg.root{color:var(--saffron);font-weight:700}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.wchip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.wchip .ar{font-size:calc(var(--ar-size)*.7);line-height:1.5}
.wchip.on{border-color:var(--accent);background:var(--soft)}
.overflow{overflow-x:auto}
table.syl{border-collapse:separate;border-spacing:4px;margin:0 auto}
table.syl th{font-weight:600;color:var(--muted);font-size:.85rem}
table.syl td:first-child{font-family:var(--ar-font);font-size:calc(var(--ar-size)*.6);color:var(--muted);text-align:center}
.sylb{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:54px;min-height:48px;cursor:pointer;font-family:var(--ar-font);font-size:calc(var(--ar-size)*.6)}
.sylb:hover{border-color:var(--accent)}
.pairs{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pair button{border:0;background:var(--card);padding:4px 14px;cursor:pointer;font-family:var(--ar-font);font-size:calc(var(--ar-size)*.6)}
.pair button+button{border-left:1px solid var(--line)}
table.conj{width:100%;border-collapse:collapse}
table.conj td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
table.conj td.ar{font-size:calc(var(--ar-size)*.55)}
table.conj td.form{font-size:calc(var(--ar-size)*.75)}
.sentence{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;margin:6px 0}
.wbtn{border:1px solid transparent;background:var(--bg);border-radius:12px;padding:2px 10px;cursor:pointer;font-family:var(--ar-font);font-size:calc(var(--ar-size)*.75);line-height:1.6}
.wbtn.on{border-color:var(--saffron);background:var(--saffron-bg)}
.winfo{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:6px}
.orderzone{min-height:72px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;align-items:center;margin-bottom:10px}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bubble{max-width:88%;border-radius:18px;padding:10px 14px;border:1px solid var(--line);background:var(--card)}
.bubble.npc{align-self:flex-start;border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--soft);border-color:var(--accent);border-bottom-right-radius:6px}
.bubble .who{font-size:.8rem;color:var(--muted)}
.bubble .ar{font-size:calc(var(--ar-size)*.65)}
.corr{align-self:flex-end;max-width:88%;font-size:.9rem;background:var(--saffron-bg);border-radius:12px;padding:6px 10px}
.choices{display:grid;gap:8px}
.choice{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;cursor:pointer;text-align:right}
.choice:hover{border-color:var(--accent)}
.choice.ko{background:var(--ko-bg);border-color:var(--ko)}
.choice .ar{font-size:calc(var(--ar-size)*.6);display:block}
.choice .tr,.choice .fr{display:block;text-align:left}
.chatbar{display:flex;gap:6px;position:sticky;bottom:76px}
.chatbar input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit;font-family:var(--ar-font),system-ui}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
label.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
select,input[type=text],input[type=password]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:60%}
input[type=range]{accent-color:var(--accent);width:50%}
details{margin-top:8px} summary{cursor:pointer;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.6rem;color:var(--accent)}
.weak{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.weak .ar{font-size:calc(var(--ar-size)*.6)}
#modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
canvas.trace{display:block;width:100%;max-width:360px;aspect-ratio:1;margin:8px auto;touch-action:none;border:2px dashed var(--line);border-radius:18px;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;z-index:60;text-align:center}
#toast.on{opacity:1}
.banner{border-left:4px solid var(--saffron);background:var(--saffron-bg)}
@media (max-width:420px){.glyph{width:92px;height:92px;font-size:62px}.opts{gap:8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" data-act="back" aria-label="Retour" hidden>‹</button>
  <div class="brand"><span class="ar" lang="ar">أَلِف</span><span>Alif</span></div>
  <div class="streak" id="streak"></div>
</header>
<main id="app"><div class="card banner"><b>L’application ne s’est pas lancée.</b><p>Le lecteur utilisé bloque le JavaScript (c’est le cas du « Lecteur HTML » intégré à Android). Ouvre ce fichier avec <b>Chrome</b> : dans Mes fichiers, appui long sur le fichier › ⋮ › Ouvrir avec › Chrome.</p></div></main>
<script>
window.addEventListener('error', function(e){ var a=document.getElementById('app'); if(a) a.insertAdjacentHTML('afterbegin','<div class="card banner"><b>Erreur au démarrage</b><p class="small">'+String(e.message).replace(/</g,'&lt;')+' (ligne '+e.lineno+')</p><p class="small">Envoie une capture de ce message.</p></div>'); });
</script>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-arg="home"><span>⌂</span>Parcours</button>
  <button data-act="tab" data-arg="review"><span>↻</span>Révision</button>
  <button data-act="tab" data-arg="stats"><span>▤</span>Progrès</button>
  <button data-act="tab" data-arg="settings"><span>⚙</span>Réglages</button>
</nav>
<div id="modal"></div>
<div id="toast" role="status"></div>

const PAST_SUF = ['ْتُ','ْتَ','ْتِ','َ','َتْ','ْتُمَا','َا','َتَا','ْنَا','ْتُمْ','ْتُنَّ','ُوا','ْنَ'];
const PRES_PRE = ['أَ','تَ','تَ','يَ','تَ','تَ','يَ','تَ','نَ','تَ','تَ','يَ','يَ'];
const PRES_END = ['ُ','ُ','ِينَ','ُ','ُ','َانِ','َانِ','َانِ','ُ','ُونَ','ْنَ','ُونَ','ْنَ'];
const IMP_IDX = [1,2,5,9,10];
const IMP_END = ['ْ','ِي','َا','ُوا','ْنَ'];
function conj(v){
  const [a,b,c] = v.root;
  const past = PAST_SUF.map(s=>a+'َ'+b+'َ'+c+s);
  const pres = PRES_PRE.map((p,i)=>p+a+'ْ'+b+v.v+c+PRES_END[i]);
  const hz = v.v==='ُ' ? 'اُ' : 'اِ';
  const imp = {}; IMP_IDX.forEach((pi,k)=>imp[pi]=hz+a+'ْ'+b+v.v+c+IMP_END[k]);
  return {past,pres,imp};
}

const TTS = {voices:[],voice:null,ok:false,checked:false};
function loadVoices(){
  if(!('speechSynthesis' in window)){ TTS.ok=false; return; }
  TTS.voices = speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
  TTS.voice = TTS.voices.find(v=>v.voiceURI===S.settings.voice) || TTS.voices.find(v=>/ar[-_]SA/i.test(v.lang)) || TTS.voices[0] || null;
  TTS.ok = !!TTS.voice;
}
function speak(text, rate, pitch){
  return new Promise(res=>{
    if(!('speechSynthesis' in window) || !text) return res();
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = TTS.voice ? TTS.voice.lang : 'ar-SA';
      if(TTS.voice) u.voice = TTS.voice;
      u.rate = rate || S.settings.rate; u.pitch = pitch || 1;
      let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
      u.onend=fin; u.onerror=fin; setTimeout(fin, 1800 + text.length*260/u.rate);
      speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}

const REC = {mr:null,box:null,timer:null};
function recBlock(model){ return `<div class="rec" data-model="${esc(model)}"><button class="btn sm" data-act="rec">🎙 M’enregistrer</button><button class="btn sm" data-say="${esc(model)}">▶ Modèle</button><button class="btn sm" data-act="me" disabled>▶ Moi</button><button class="btn sm" data-act="ab" disabled>⇄ Comparer</button></div>`; }
async function toggleRec(box){
  if(REC.mr && REC.mr.state==='recording'){ REC.mr.stop(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast('Enregistrement indisponible dans ce navigateur. Essaie Chrome.'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream); const chunks=[];
    mr.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop()); clearTimeout(REC.timer);
      const blob = new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      if(box.dataset.me) URL.revokeObjectURL(box.dataset.me);
      box.dataset.me = URL.createObjectURL(blob);
      box.classList.remove('recording');
      const b = box.querySelector('[data-act="rec"]'); if(b) b.textContent='🎙 Recommencer';
      box.querySelectorAll('[data-act="me"],[data-act="ab"]').forEach(x=>x.disabled=false);
      REC.mr=null;
    };
    REC.mr=mr; REC.box=box; mr.start(); box.classList.add('recording');
    const b = box.querySelector('[data-act="rec"]'); if(b) b.textContent='⏹ Arrêter';
    REC.timer = setTimeout(()=>{ if(mr.state==='recording') mr.stop(); }, 7000);
  }catch(e){ toast('Micro refusé ou indisponible. Autorise le micro dans le navigateur.'); }
}

const NONCONN = new Set([...'اأإآدذرزوؤءة']);
const baseChars = s => strip(s).replace(/[\u200d\u0640]/g,'');
function renderSegs(segs, keep){
  const n = segs.length;
  return segs.map((g,i)=>{
    const s = fmt(g.s, keep);
    const prevB = i>0 ? baseChars(segs[i-1].s).slice(-1) : '';
    const lastB = baseChars(g.s).slice(-1);
    const joinPrev = i>0 && prevB && !NONCONN.has(prevB);
    const joinNext = i<n-1 && lastB && !NONCONN.has(lastB);
    return `<span class="seg ${g.cls||''}" data-i="${i}">${joinPrev?'\u200d':''}${esc(s)}${joinNext?'\u200d':''}</span>`;
  }).join('');
}
const clusters = s => s.match(/[^\u064B-\u0652\u0670][\u064B-\u0652\u0670]*/g) || [];
function colorRoot(form, root){ let k=0; return renderSegs(clusters(form).map(cl=>{ if(k<3 && cl[0]===root[k]){ k++; return {s:cl,cls:'root'}; } return {s:cl}; }), true); }
function forms(c){ const L=LETTER[c], T='ـ'; return {iso:c, ini:L.conn?c+T:c, med:L.conn?T+c+T:T+c, fin:T+c}; }
const contains = (w,c) => c==='ا' ? /[اأإآ]/.test(strip(w)) : strip(w).includes(c);

function qSign(G, kind){

  const item = 'G|'+G.id;

function syllOptions(sy){
  const same = SYLL.filter(x=>x.c===sy.c && x!==sy && (sy.long || !x.long));
  const confC = (DATA.conf[sy.c]||[]).filter(c=>c!=='ا' && LETTER[c]);
  const conf = SYLL.filter(x=>confC.includes(x.c) && x.v===sy.v && x.long===sy.long);
  const pool = [...shuffle(same).slice(0,2), ...shuffle(conf).slice(0,1), ...shuffle(same), ...shuffle(SYLL.filter(x=>x.long===sy.long))];
  const out=[], seenT=new Set([sy.t]);
  for(const x of pool){ if(!seenT.has(x.t)){ out.push(x); seenT.add(x.t); } if(out.length===3) break; }
  return shuffle([sy,...out]);
}
function qSyll(sy, kind){
  kind = kind || pick(['listen','see']); const opts = syllOptions(sy); const item='S|'+sy.ar;
  const explain = `${sy.ar} se lit « ${sy.t} ».`;
  if(kind==='listen') return {item, say:sy.ar, prompt:'Écoute et choisis la syllabe.', options:opts.map(x=>({key:x.ar,html:ar(x.ar,'mid',true)})), answer:[sy.ar], explain};

function qWord(w, pool, kind, prefix){
  kind = kind || pick(['listen','tr','fr']);

  const cands = []; const seenAr = new Set([w.ar]), seenFr = new Set([w.fr]);
  for(const x of shuffle(pool)){ if(!seenAr.has(x.ar) && !seenFr.has(x.fr)){ cands.push(x); seenAr.add(x.ar); seenFr.add(x.fr); } if(cands.length===3) break; }

function qRoot(){

function qVerb(v, kind){

  const qs=[];
  if(L.kind==='letters'){ const ls=[...L.letters].map(c=>LETTER[c]); const K=['listen','sound','form','word']; for(let i=0;i<10;i++) qs.push(qLetter(ls[i%ls.length], K[(i+Math.floor(i/ls.length))%4])); }
  else if(L.kind==='signs'){ const ss=shuffle(DATA.signs); for(let i=0;i<10;i++) qs.push(qSign(ss[i%ss.length], i%2?'name':'listen')); }
  else if(L.kind==='syll'){ sample(SYLL.filter(s=>s.long===L.long),10).forEach((s,i)=>qs.push(qSyll(s, i%2?'see':'listen'))); }
  else if(L.kind==='words'){ const ws=DATA.words.slice(L.from,L.to); const K=['listen','tr','fr']; shuffle(ws).slice(0,10).forEach((w,i)=>qs.push(qWord(w,DATA.words,K[i%3]))); }
  else if(L.kind==='al'){ const K=['sun','listen','fr']; shuffle(DATA.alWords).forEach((w,i)=>qs.push(qWord(w,DATA.alWords,K[i%3]))); }
  else if(L.kind==='vocab'){ DATA.vocab.forEach(v=>{ qs.push(qWord(v,[...DATA.vocab,...DATA.words],'fr','V|')); qs.push(qWord(v,[...DATA.vocab,...DATA.words],'listen','V|')); }); qs.push(qRoot()); qs.push(qRoot()); }
  else if(L.kind==='verbs'){ const K=['conj','pron','root']; for(let i=0;i<10;i++) qs.push(qVerb(DATA.verbs[i%3], K[i%3])); }
  else if(L.kind==='sentences'){ DATA.sentences.forEach((p,i)=>{ qs.push(qSent(i,'order')); qs.push(qSent(i,'fr')); qs.push(qSent(i,'listen')); }); }
  return shuffle(qs.filter(Boolean));
}

/* ---------- Quiz ---------- */
let Q = null;
function startQuiz(qs, meta){ Q = {qs:qs.filter(Boolean), i:0, score:0, answered:false, picked:null, graded:new Set(), meta, ord:[], saidFor:-1}; if(!Q.qs.length){ toast('Aucune question disponible.'); return; } go('quiz'); }
VIEWS.quiz = () => {
  if(!Q) return '<p>Aucun quiz en cours.</p>';
  if(Q.i >= Q.qs.length) return quizEnd();
  const q = Q.qs[Q.i];
  let h = `<div class="progress"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><p class="small muted">Question ${Q.i+1} sur ${Q.qs.length}</p><div class="card"><div class="qprompt">${q.prompt}</div>`;
  if(q.say) h += `<div class="row center"><button class="btn" data-say="${esc(q.say)}">🔊 Réécouter</button><button class="btn ghost" data-say="${esc(q.say)}" data-rate="0.55">🐢 Lent</button></div>`;
  if(q.show) h += `<div class="show">${q.show}</div>`;
  if(q.kind==='order'){
    const picked = Q.ord;
    h += `<div class="orderzone">${picked.length?picked.map((wi,k)=>`<button class="wbtn on" lang="ar" data-act="ordundo" data-arg="${k}" ${Q.answered?'disabled':''}>${esc(fmt(q.words[wi]))}</button>`).join(''):'<span class="small muted" dir="ltr">Touche les mots ci-dessous</span>'}</div>`;
    h += `<div class="sentence">${q.words.map((w,wi)=>picked.includes(wi)?'':`<button class="wbtn" lang="ar" data-act="ordpick" data-arg="${wi}" ${Q.answered?'disabled':''}>${esc(fmt(w))}</button>`).join('')}</div>`;
    if(!Q.answered) h += `<button class="btn primary block" data-act="ordcheck" ${picked.length===q.words.length?'':'disabled'}>Vérifier</button>`;
  } else {
    h += `<div class="opts">${q.options.map(o=>{ let cls=''; if(Q.answered){ if(q.answer.includes(o.key)) cls='ok'; else if(o.key===Q.picked) cls='ko'; } return `<button class="opt ${cls}" data-act="ans" data-arg="${esc(o.key)}" ${Q.answered?'disabled':''}>${o.html}</button>`; }).join('')}</div>`;
  }
  if(Q.answered){
    h += `<div class="fb ${Q.lastOk?'ok':'ko'}"><b>${Q.lastOk?'Bonne réponse.':'Pas tout à fait.'}</b>${q.kind==='order'&&!Q.lastOk?`<div>${ar(q.correct,'sm')}</div>`:''}<span>${esc(q.explain||'')}</span></div><button class="btn primary block" data-act="next">${Q.i+1<Q.qs.length?'Question suivante':'Voir le résultat'}</button>`;
  }
  h += `</div>`;
  if(q.say && Q.saidFor!==Q.i){ Q.saidFor=Q.i; AFTER = ()=>setTimeout(()=>speak(q.say),250); }
  return h;
};
function answer(key){
  const q = Q.qs[Q.i]; if(Q.answered) return;
  const ok = q.kind==='order' ? Q.ord.map(i=>q.words[i]).join(' ')===q.correct : q.answer.includes(key);
  Q.answered=true; Q.picked=key; Q.lastOk=ok; if(ok) Q.score++;
  if(q.item && !Q.graded.has(q.item)){ Q.graded.add(q.item); grade(q.item, ok); } else touchStreak();
  render();
  const after = q.kind==='order' ? q.say : q.sayAfter; if(after) speak(after);
}
function quizEnd(){
  const pct = Math.round(Q.score/Q.qs.length*100); const m = Q.meta||{};
  let msg = '';
  if(m.lessonId && !Q.recorded){ Q.recorded=true; const r = S.lessons[m.lessonId] || {best:0,done:false}; r.best = Math.max(r.best||0, pct); if(pct>=80) r.done=true; S.lessons[m.lessonId]=r; save(); }
  if(m.lessonId) msg = pct>=80 ? 'Leçon validée. La suivante est débloquée.' : 'Il faut 80 % pour valider. Relis les cartes puis réessaie.';
  else msg = 'Révision terminée. Les éléments ratés reviendront plus tôt.';
  return `<div class="card center"><div class="score">${pct} %</div><p>${Q.score} bonne${Q.score>1?'s':''} réponse${Q.score>1?'s':''} sur ${Q.qs.length}</p><p>${msg}</p>

}

async function chatCall(){

  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:700,system:sys,messages:CHAT.msgs.map(m=>({role:m.role,content:m.role==='assistant'?m.raw:m.content}))})});
  if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,160)}`); }

/* ---------- Tracé des lettres ---------- */
function openTrace(c){
  const L = LETTER[c]; const m = $('#modal');
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Tracer ${esc(L.n)}"><div class="row between"><h2>Tracer ${ar(c,'sm',true)} <span class="small muted">${esc(L.n)}</span></h2><button class="btn ghost" data-act="close" aria-label="Fermer">✕</button></div><p class="small muted">Suis le modèle avec le doigt. Écris de droite à gauche et place les points à la fin.</p><canvas class="trace" width="480" height="480"></canvas><div class="row center"><button class="btn" data-act="tclear">Effacer</button><button class="btn primary" data-act="tcheck">Vérifier</button><button class="btn" data-say="${esc(L.s)}">🔊</button></div><div id="tracefb"></div></div>`;
  m.classList.add('on');
  const cv = m.querySelector('canvas'), ctx = cv.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const font = `300px ${css('--ar-font')}`;
  const T = {c, strokes:[], cur:null, cv, ctx, font};
  const drawGuide = (g, color, extra) => { g.save(); g.font=font; g.textAlign='center'; g.textBaseline='alphabetic'; g.direction='rtl'; const mt=g.measureText(c); const h=(mt.actualBoundingBoxAscent||200)+(mt.actualBoundingBoxDescent||0); const y = 240 + h/2 - (mt.actualBoundingBoxDescent||0); g.fillStyle=color; g.fillText(c,240,y); if(extra){ g.lineWidth=extra; g.strokeStyle=color; g.lineJoin='round'; g.strokeText(c,240,y);} g.restore(); };
  T.redraw = () => { ctx.clearRect(0,0,480,480); drawGuide(ctx, css('--line')); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=16; ctx.strokeStyle=css('--accent'); T.strokes.forEach(s=>{ ctx.beginPath(); s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]); ctx.stroke(); }); };
  T.drawGuide = drawGuide;
  const pos = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*480/r.width, (e.clientY-r.top)*480/r.height]; };
  cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId); T.cur=[pos(e)]; T.strokes.push(T.cur); T.redraw(); });
  cv.addEventListener('pointermove', e=>{ if(!T.cur) return; T.cur.push(pos(e)); T.redraw(); });
  const end = ()=>{ T.cur=null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  window.TRACE = T; T.redraw();
}
function checkTrace(){
  const T = window.TRACE; if(!T || !T.strokes.length){ toast('Trace d’abord la lettre.'); return; }
  const N=120, k=N/480;
  const mk = () => { const c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'); g.scale(k,k); return g; };
  const gGuide=mk(), gDil=mk(), gThin=mk(), gThick=mk();
  T.drawGuide(gGuide,'#000'); T.drawGuide(gDil,'#000',44);
  const strokeAll = (g,w) => { g.lineCap='round'; g.lineJoin='round'; g.lineWidth=w; g.strokeStyle='#000'; T.strokes.forEach(s=>{ g.beginPath(); s.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); if(s.length===1) g.lineTo(s[0][0]+.1,s[0][1]); g.stroke(); }); };
  strokeAll(gThin,16); strokeAll(gThick,52);
  const px = g => g.getImageData(0,0,N,N).data;
  const A=px(gGuide), B=px(gDil), U=px(gThin), V=px(gThick);
  let guide=0, cov=0, user=0, prec=0;
  for(let i=3;i<A.length;i+=4){ if(A[i]>100){ guide++; if(V[i]>100) cov++; } if(U[i]>100){ user++; if(B[i]>100) prec++; } }
  const c = guide?cov/guide:0, p = user?prec/user:0; const score = Math.round(Math.min(c,p)*100);
  const msg = score>=70 ? 'Très bien.' : score>=45 ? 'Pas mal. Repasse plus près du modèle.' : 'Essaie encore en suivant bien le modèle.';
  $('#tracefb').innerHTML = `<div class="fb ${score>=70?'ok':score>=45?'':'ko'}"><b>${msg}</b><span class="small">Couverture ${Math.round(c*100)} % · précision ${Math.round(p*100)} %. L’ordre des traits n’est pas vérifié.</span></div>`;
}

document.addEventListener('click', e=>{
  const sayEl = e.target.closest('[data-say]');
  if(sayEl && !sayEl.disabled){ SEQ++; speak(sayEl.dataset.say, sayEl.dataset.rate ? +sayEl.dataset.rate : undefined); }
  if(e.target.id==='modal'){ closeModal(); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch(a){
    case 'tab': tab(arg); break;
    case 'back': back(); break;
    case 'go': go(arg); break;
    case 'lesson': go('lesson',{id:arg}); break;
    case 'quiz': startQuiz(buildQuiz(lessonById(arg)),{lessonId:arg}); break;
    case 'review': startQuiz(dueItems().slice(0,15).map(qForItem),{review:true}); break;
    case 'weak': startQuiz(weakItems().slice(0,12).map(qForItem),{review:true}); break;
    case 'ans': answer(arg); break;
    case 'next': Q.i++; Q.answered=false; Q.picked=null; Q.ord=[]; window.scrollTo(0,0); render(); break;
    case 'ordpick': Q.ord.push(+arg); render(); break;
    case 'ordundo': Q.ord.splice(+arg,1); render(); break;
    case 'ordcheck': answer(null); break;
    case 'wsel': VIEW.params.sel=+arg; render(); break;
    case 'readseq': readSeq(); break;
    case 'verb': VIEW.params.v=+arg; render(); break;
    case 'tense': VIEW.params.t=arg; render(); break;
    case 'sword': { const [si,wi]=arg.split(':').map(Number); VIEW.params.open=VIEW.params.open||{}; VIEW.params.open[si] = VIEW.params.open[si]===wi?null:wi; render(); const w=DATA.sentences[si].words[wi]; if(VIEW.params.open[si]!=null) speak(w[0]); break; }
    case 'sbare': VIEW.params.bare=VIEW.params.bare||{}; VIEW.params.bare[arg]=!VIEW.params.bare[arg]; render(); break;
    case 'trace': openTrace(arg); break;
    case 'tclear': if(window.TRACE){ window.TRACE.strokes=[]; window.TRACE.redraw(); $('#tracefb').innerHTML=''; } break;
    case 'tcheck': checkTrace(); break;
    case 'close': closeModal(); break;
    case 'rec': toggleRec(el.closest('.rec')); break;
    case 'me': { const b=el.closest('.rec'); if(b.dataset.me) playUrl(b.dataset.me); break; }
    case 'ab': { const b=el.closest('.rec'); (async()=>{ await speak(b.dataset.model); await sleep(300); if(b.dataset.me) await playUrl(b.dataset.me); })(); break; }
    case 'dlg': { const [id,mode]=arg.split(':'); startDialogue(id,mode); break; }
    case 'dmode': D.mode=arg; D.spoken=null; SEQ++; render(); break;
    case 'dfr': D.showFr=!D.showFr; render(); break;
    case 'dlisten': dlgListenAll(); break;
    case 'dchoose': { const dl=DLG[D.id], nd=dl.nodes[D.node], c=dChoices(dl,nd)[+arg]; if(c.ok){ D.pending=c; D.fb=''; render(); speak(c.ar); } else { (D.wrong[D.node]=D.wrong[D.node]||[]).push(+arg); D.fb=c.why||''; render(); } break; }
    case 'dcont': { const dl=DLG[D.id]; D.hist.push({npc:dl.nodes[D.node].npc, me:D.pending}); D.node=D.pending.next; D.pending=null; D.fb=''; if(dl.nodes[D.node].end){ S.dialogues[D.id]=true; if(DATA.dialogues.every(d=>S.dialogues[d.id])) S.lessons['6-1']={done:true,best:100}; save(); touchStreak(); } render(); break; }
    case 'drestart': startDialogue(D.id,'play'); HIST.pop(); break;
    case 'chatstart': chatSend('Commence la conversation.', true); break;
    case 'chatsend': { const i=$('#chatIn'); const t=i&&i.value.trim(); if(t) chatSend(t); break; }
    case 'chatmic': chatMic(); break;
    case 'chatreset': CHAT.msgs=[]; render(); break;
    case 'export': exportProgress(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': if(confirm('Effacer toute la progression ? Les réglages sont conservés.')){ S.lessons={}; S.items={}; S.streak={n:0,last:-1}; S.dialogues={}; save(); toast('Progression effacée.'); render(); } break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='chatIn'){ e.preventDefault(); const t=e.target.value.trim(); if(t) chatSend(t); } if(e.key==='Escape') closeModal(); });
document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.set){ const k=el.dataset.set; let v = el.type==='checkbox' ? el.checked : el.value; if(k==='size'||k==='rate') v=+v; S.settings[k]=v; save(); applySettings(); if(k==='voice') loadVoices(); if(!['apiKey','model','size'].includes(k)) render(); }
  if(el.dataset.chat==='theme'){ CHAT.theme=el.value; }
  if(el.id==='importFile' && el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o || typeof o!=='object' || !o.items) throw 0; const key=S.settings.apiKey; S=merge(o); S.settings.apiKey=key; save(); applySettings(); toast('Progression importée.'); render(); }catch(err){ toast('Fichier invalide : ce n’est pas un export Alif.'); } el.value=''; }; r.readAsText(el.files[0]); }
});
document.addEventListener('input', e=>{ if(e.target.dataset.set==='size'){ S.settings.size=+e.target.value; applySettings(); } });
function closeModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; window.TRACE=null; }
async function readSeq(){
  if(!READER) return; const my = ++SEQ; const box=$('#rw'); if(!box) return; const spans=[...box.querySelectorAll('.seg')];
  if(!READER.wholeOnly){ for(let i=0;i<spans.length;i++){ if(my!==SEQ) return; spans.forEach(s=>s.classList.remove('hl')); spans[i].classList.add('hl'); await speak(READER.segs[i].s, S.settings.rate*0.85); await sleep(200); } }
  if(my!==SEQ) return; spans.forEach(s=>s.classList.add('hl')); await speak(READER.whole); spans.forEach(s=>s.classList.remove('hl'));
}
function exportProgress(){
  const o = clone(S); delete o.settings.apiKey;
  const d = new Date(); const name = `alif-progression-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =========================================================================
   DÉMARRAGE
   ========================================================================= */
applySettings(); loadVoices();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { const before=TTS.ok; loadVoices(); TTS.checked=true; if(before!==TTS.ok && ['home','settings'].includes(VIEW.name)) render(); };
setTimeout(()=>{ loadVoices(); TTS.checked=true; if(['home','settings'].includes(VIEW.name)) render(); }, 1200);
window.addEventListener('online', ()=>{ if(VIEW.name==='chat') render(); });
window.addEventListener('offline', ()=>{ if(VIEW.name==='chat') render(); });
render();

// Mise en cache hors ligne (sans effet en local file:// ; actif une fois hébergée en https://)
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
